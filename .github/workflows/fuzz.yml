name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed to reproduce a finding'
        required: false

# One job per harness, each with the WHOLE budget, rather than one job splitting
# it: the harnesses run at throughputs orders of magnitude apart, so a shared
# budget is really a budget for the fastest of them. Separate jobs also mean a
# red run in one still lets the others spend their time, and the job name says
# which harness failed without opening a log.
#
# NOT a merge gate. A clean run means "nothing failed inside that budget", never
# "there is nothing to find".
#
# `tb` IS NOT IN THE MATRIX. It used to find either of two known defects within
# seconds of every run:
#
#   E1  a corrupt table crashes the engine (SIGSEGV in decompress_pairs)
#   E2  a corrupt table aborts through an uncaught std::bad_alloc
#
# A job that reports the same recorded defect every night is not a check, and
# continue-on-error would only have made it a check nobody is required to read.
#
# E2 IS CLOSED, and so is every header-shaped form of E1: the reader now bounds
# every span it derives against the mapping it read them from, and tests/
# malformed.sh holds six fixtures on it. What is left of E1 is ONE site, and it
# is not a header defect -- decompress_pairs walks blockLength[] forwards and
# backwards from a block index that came out of sparseIndex[], with no bound on
# either loop. Measured on this branch: 1728 mutation rounds clean, round 1728 a
# SIGSEGV in the backward walk. That is inside a nightly budget, so the lane
# would still be red on a known defect, which is the whole objection above.
#
# The bound cannot move to load time -- validating sparseIndex[] is O(file size)
# and would force a 6-man table resident -- so it costs a compare inside the
# decode loop and needs a measurement on a probing workload. No perf gate here
# can take one yet: the bench never probes.
#
# Everything `tb` needs is still in the tree -- the harness, tbfetch.sh, the
# verdict comparison against a clean reference, and the fuzz-tb / fuzz-rig /
# fuzz-verdict negative-control rows -- so it runs by hand:
#
#   ./tests/tbfetch.sh && ./tests/fuzz.py --seconds 600 --harness tb
#
# Restoring it in the commit that bounds the block walk means adding `tb` to the
# matrix AND adding back the fetch step it needs, which does not sit here as a
# step that can never run:
#
#   - name: Fetch the 3-man tablebases
#     if: matrix.harness == 'tb'
#     continue-on-error: true     # a mirror outage must not fail the job
#     run: ./tests/tbfetch.sh
jobs:
  Fuzz:
    name: ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness: [uci, net, shm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        working-directory: src
        run: make -j build ARCH=x86-64-avx2
      - name: Fuzz
        run: ./tests/fuzz.py --seconds 600 --harness ${{ matrix.harness }} ${{ github.event.inputs.seed && format('--seed {0}', github.event.inputs.seed) || '' }}

  # The in-process search fuzzer. A different instrument from the harnesses
  # above, not a fourth one of them: those drive the shipped binary's stdin, so a
  # mutation spends most of its budget in the command parser. This one links
  # src/engine/ alone, registers no seam, and puts nothing between libFuzzer and
  # the node body -- under ASan and UBSan, which the stdin harnesses do not run.
  # Because it registers no seam, it is also the only lane that reads a member
  # the host would otherwise have assigned: see the initialiser comment on
  # SearchManager in src/engine/search.h.
  FuzzSearch:
    name: search (in-process, ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # THE CORPUS IS THE FUZZER'S MEMORY. Without it every nightly run starts
      # from empty and spends its budget rediscovering the same shallow coverage,
      # so the job never gets deeper than its first night. restore-keys makes a
      # run whose exact key misses still start from the most recent corpus.
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fuzz-corpus-search
          key: fuzz-corpus-search-${{ github.run_id }}
          restore-keys: fuzz-corpus-search-

      # Install the toolchain fuzzsearch.sh needs and probe it here, so a red
      # step means a finding and never "this runner lacked a tool": the gate
      # exits 2 for SKIPPED and any non-zero status fails a step, so the two are
      # indistinguishable from the run's status alone. Do not reach for
      # continue-on-error instead -- it would leave the lane unable to fail.
      - name: Install clang with libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          echo 'int main(){return 0;}' > /tmp/probe.cpp
          clang++ -fsanitize=fuzzer-no-link -c -o /dev/null /tmp/probe.cpp

      - name: Fetch the net
        working-directory: src
        run: make net

      - name: Fuzz the search
        run: ./tests/fuzzsearch.sh --seconds 600 --corpus .fuzz-corpus-search

      # The reproducer is the whole value of a red run: without it the finding is
      # "it crashed once, somewhere, on an input nobody kept".
      - name: Keep the reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-search-reproducer
          path: fuzz-search-*
          if-no-files-found: ignore
