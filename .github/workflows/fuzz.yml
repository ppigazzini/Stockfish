name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed to reproduce a finding'
        required: false

# One job per harness, each with the WHOLE budget, rather than one job splitting
# it: the harnesses run at throughputs orders of magnitude apart, so a shared
# budget is really a budget for the fastest of them. Separate jobs also mean a
# red run in one still lets the others spend their time, and the job name says
# which harness failed without opening a log.
#
# NOT a merge gate. A clean run means "nothing failed inside that budget", never
# "there is nothing to find".
#
# `tb` IS NOT IN THE MATRIX. It finds one of two known defects within seconds
# of every run:
#
#   E1  a corrupt table crashes the engine (SIGSEGV in decompress_pairs)
#   E2  a corrupt table aborts through an uncaught std::bad_alloc
#
# A job that reports the same two recorded defects every night is not a check,
# and continue-on-error would only have made it a check nobody is required to
# read. It is out until the defects are fixed.
#
# Nothing was deleted. The harness, tbfetch.sh, the verdict comparison against a
# clean reference, and the fuzz-tb / fuzz-rig / fuzz-verdict negative-control
# rows all remain, and run by hand:
#
#   ./tests/tbfetch.sh && ./tests/fuzz.py --seconds 600 --harness tb
#
# Restoring it in the commit that closes E1 and E2 means adding `tb` to the
# matrix AND putting back the corpus fetch, which went with it rather than
# staying here as a step that can never run:
#
#   - name: Fetch the 3-man tablebases
#     if: matrix.harness == 'tb'
#     continue-on-error: true     # a mirror outage must not fail the job
#     run: ./tests/tbfetch.sh
jobs:
  Fuzz:
    name: ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness: [uci, net, shm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build
        working-directory: src
        run: make -j build ARCH=x86-64-avx2
      - name: Fuzz
        run: ./tests/fuzz.py --seconds 600 --harness ${{ matrix.harness }} ${{ github.event.inputs.seed && format('--seed {0}', github.event.inputs.seed) || '' }}

  # The in-process search fuzzer. A different instrument from the harnesses
  # above, not a fourth one of them: those drive the shipped binary's stdin, so a
  # mutation spends most of its budget in the command parser. This one links
  # src/engine/ alone, registers no seam, and puts nothing between libFuzzer and
  # the node body -- under ASan and UBSan, which the stdin harnesses do not run.
  #
  # Its first run found real UB: SearchManager had six members with no
  # initialisers, valid only because the host assigned them, and a search with no
  # host read `ponder` before anything wrote it.
  FuzzSearch:
    name: search (in-process, ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # THE CORPUS IS THE FUZZER'S MEMORY. Without it every nightly run starts
      # from empty and spends its budget rediscovering the same shallow coverage,
      # so the job never gets deeper than its first night. restore-keys makes a
      # run whose exact key misses still start from the most recent corpus.
      - name: Restore the corpus
        uses: actions/cache@v4
        with:
          path: .fuzz-corpus-search
          key: fuzz-corpus-search-${{ github.run_id }}
          restore-keys: fuzz-corpus-search-

      - name: Fetch the net
        working-directory: src
        run: make net

      - name: Fuzz the search
        run: ./tests/fuzzsearch.sh --seconds 600 --corpus .fuzz-corpus-search

      # The reproducer is the whole value of a red run: without it the finding is
      # "it crashed once, somewhere, on an input nobody kept".
      - name: Keep the reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-search-reproducer
          path: fuzz-search-*
          if-no-files-found: ignore
