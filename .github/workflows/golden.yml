name: Golden

on:
  workflow_call:
  workflow_dispatch:

jobs:
  Golden:
    name: UCI output corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        working-directory: src
        run: make -j build ARCH=x86-64-avx2

      # Here because it needs a built engine and this lane already has one. It
      # asks the engine what defaults it registered rather than parsing the four
      # Option shapes options.add() is written in, one of whose defaults is a
      # named constant -- so a parser would have to resolve C++ to answer.
      - name: Engine and UCI option defaults agree
        run: ./tests/optiondefaults.sh

      # The `tablebase` case loads real tables, because the two rows it pins --
      # `Tablebases WDL:` and `Tablebases DTZ:` in the `d` board -- exist only
      # when tables are loaded. Without the corpus that case SKIPS, and a lane
      # that skips the only case exercising a feature is a lane that does not
      # cover it.
      #
      # 4.4 MB for the 3-4-man set, so it is cached rather than re-fetched: the
      # key names the script, and the script's stem list is what decides what
      # lands in the directory, so a change to either takes a new cache.
      #
      # 4-man and not 3-man. MaxCardinality is 4 with this corpus, which is what
      # lets the case pin a 4-man probe (KRvKR) beside the 3-man ones -- and a
      # 4-man probe reaches a different ProbeState than a 3-man one does.
      - name: Cache the 3-4-man tablebases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/syzygy-34man
          key: syzygy-34man-${{ hashFiles('tests/tbfetch.sh') }}
      - name: Fetch the 3-4-man tablebases
        run: ./tests/tbfetch.sh --men 4

      - name: Compare the corpus
        run: ./tests/golden.sh
