name: Golden

on:
  workflow_call:
  workflow_dispatch:

# Least privilege at the workflow level so a job added later inherits it.
# A job needing more declares it and that grant wins.
permissions:
  contents: read

jobs:
  Golden:
    name: UCI output corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        working-directory: src
        run: make -j build ARCH=x86-64-avx2

      # Here because it needs a built engine and this lane already has one. It
      # asks the engine what defaults it registered rather than parsing the four
      # Option shapes options.add() is written in, one of whose defaults is a
      # named constant -- so a parser would have to resolve C++ to answer.
      - name: Engine and UCI option defaults agree
        run: ./tests/optiondefaults.sh

      # The `tablebase` case loads real tables, because the two rows it pins --
      # `Tablebases WDL:` and `Tablebases DTZ:` in the `d` board -- exist only
      # when tables are loaded. Without the corpus that case SKIPS, and a lane
      # that skips the only case exercising a feature is a lane that does not
      # cover it.
      #
      # 4.4 MB for the 3-4-man set, so it is cached rather than re-fetched: the
      # key names the script, and the script's stem list is what decides what
      # lands in the directory, so a change to either takes a new cache.
      #
      # 4-man and not 3-man. MaxCardinality is 4 with this corpus, which is what
      # lets the case pin a 4-man probe (KRvKR) beside the 3-man ones -- and a
      # 4-man probe reaches a different ProbeState than a 3-man one does.
      - name: Cache the 3-4-man tablebases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/syzygy-34man
          key: syzygy-34man-${{ hashFiles('tests/tbfetch.sh') }}
      - name: Fetch the 3-4-man tablebases
        run: ./tests/tbfetch.sh --men 4

      # The `tablebase5` case needs the `--men 5` corpus, KNNvKP and the four stems
      # a capture from it reaches: the only corpus here with a DTZ past 100, so the
      # only one whose positions are cursed wins and blessed losses. The prober adds
      # the hundred on that branch and ranks a root under Syzygy50MoveRule on it,
      # and no other lane reads either. 23 MB, cached on the script as the
      # sanitizers lane caches the same corpus.
      #
      # BEST EFFORT, unlike the 3-4-man fetch above: a mirror outage skips the one
      # case rather than failing the lane, and the comparison step below says so in
      # a warning, because a lane that skipped the case did not cover it.
      - name: Cache the KNNvKP corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/syzygy-5man
          key: syzygy-5man-${{ hashFiles('tests/tbfetch.sh') }}
      - name: Fetch the KNNvKP corpus (best effort; tablebase5 skips without it)
        continue-on-error: true
        run: ./tests/tbfetch.sh --men 5

      # The gate's own exit code decides the step; the output is read only for the
      # skip, which golden.sh reports in its summary rather than as a failure.
      - name: Compare the corpus
        run: |
          rc=0
          ./tests/golden.sh > golden.out 2>&1 || rc=$?
          cat golden.out
          if grep -q 'SKIPPED' golden.out; then
            echo "::warning title=golden case SKIPPED::$(grep 'SKIPPED' golden.out | head -1 | sed 's/^ *//')"
          fi
          exit "$rc"

      # Owns its own deadline, which is the whole gate: a wedged engine is a
      # harness timeout to golden.sh and to instrumented.py, and a harness
      # timeout is a rig fault rather than a detection. Four defects on this
      # branch are "the engine does not come back" and nothing else here can
      # express that class.
      - name: Liveness
        run: ./tests/liveness.sh
