name: Android Compilation
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
# Least privilege at the workflow level so a job added later inherits it.
# A job needing more declares it and that grant wins.
permissions:
  contents: read

jobs:
  Compilation:
    name: "Android build: ${{ matrix.config.name }} ${{ matrix.binaries }}"
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 20
    env:
      COMPCXX: ${{ matrix.config.compiler }}
      COMP: ${{ matrix.config.comp }}
      EMU: ${{ matrix.config.emu }}
      EXT: ${{ matrix.config.ext }}
      BINARY: ${{ matrix.binaries }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    defaults:
      run:
        working-directory: src
        shell: ${{ matrix.config.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download required linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install qemu-user

      - name: Install NDK
        if: runner.os == 'Linux'
        run: |
          if [ $COMP == ndk ]; then
            NDKV="27.2.12479018"
            ANDROID_ROOT=/usr/local/lib/android
            ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
            SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
            echo "y" | $SDKMANAGER "ndk;$NDKV"
            ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
            ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
            echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV
          fi

      - name: Extract the bench number from the commit history
        run: |
          # See tests.yml for why this is one `git log` and an anchored regex.
          # A HERE-STRING, not a pipe from git log. `grep -m1` exits on the first
          # match and closes the pipe, `git log` dies of SIGPIPE part-way through
          # the history, and `pipefail` propagates 141 -- so the step fails
          # BECAUSE the anchor was found. Capturing first lets the producer finish.
          history=$(git log --format=%b)
          benchref=$(grep -m1 -oE '^Bench: *[1-9][0-9]{5,7}$' <<< "$history" | grep -oE '[0-9]+' || true)
          [[ -n "$benchref" ]] || { echo "No Bench: footer anywhere in the history -- refusing to run the anchor lanes against an empty reference"; exit 1; }
          echo "benchref=$benchref" >> $GITHUB_ENV
          echo "Reference bench: $benchref"

      - name: Download the used network from the fishtest framework
        run: make net

      - name: Check compiler
        run: |
          if [ $COMP == ndk ]; then
            export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
          fi
          $COMPCXX -v

      - name: Test help target
        run: make help

      - name: Check git
        run: git --version

      # Compile profile guided builds

      - name: Compile ${{ matrix.binaries }} build
        run: |
          if [ $COMP == ndk ]; then
            export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
            export LDFLAGS="-static -Wno-unused-command-line-argument"
          fi
          make clean
          make -j4 profile-build ARCH=$BINARY COMP=$COMP RUN_PREFIX=$EMU
          make strip ARCH=$BINARY COMP=$COMP
          RUN_PREFIX=$EMU ../tests/signature.sh "$benchref"
          mv ./stockfish$EXT ../stockfish-android-$BINARY$EXT

      - name: Remove non src files
        run: git clean -fxd

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.config.simple_name }} ${{ matrix.binaries }}
          path: |
            .
            !.git
            !.output
