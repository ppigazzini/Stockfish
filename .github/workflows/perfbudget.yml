name: Perf budget

on:
  workflow_call:
  workflow_dispatch:

# Build and measure both sides in one job, on the SAME runner in the SAME run,
# so nothing is stored and nothing has to be reproduced across machines or
# toolchains. An absolute instruction count is a property of the box as much as
# of the code, so a baseline kept from an earlier run compares two boxes.
# Least privilege at the workflow level so a job added later inherits it.
# A job needing more declares it and that grant wins.
permissions:
  contents: read

jobs:
  Budget:
    name: Instruction budget (base vs head)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A locality change can legitimately cost instructions -- upstream
    # ee72cf49f is the worked example, see docs/11-performance.md. This lane is
    # therefore informative on such a PR and authoritative on a refactor that
    # claims to cost nothing. It does not replace fishtest.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Download the network
        working-directory: src
        run: make net

      # On a pull request the base is the target branch's tip and the answer is
      # unambiguous. On a PUSH it used to be HEAD~1, which measures the last
      # commit of the push and silently drops the rest: a push of twelve commits
      # got one covered lane between them, which is how the second defect
      # campaign's whole close-out went through this gate.
      #
      # github.event.before is the tip the branch had BEFORE the push, so the
      # push is measured whole. Two ways it is not usable, and both fall back to
      # the fork point -- which is what perfcounters.sh and perfdecomp.sh already
      # default to:
      #
      #   * all zeroes, on the first push to a new branch;
      #   * unreachable, after a force-push rewrote it away.
      #
      # The fallback is a real base rather than a skip. A skip here would be
      # reported as a pass by anything reading the exit code, and refish.yml
      # asserts on unexpected skips precisely so that cannot happen quietly.
      #
      # A REAL BASE STILL HAS TO BE A COMPARABLE ONE. perfbudget.sh voids a pair
      # whose sides embed different nets or search different trees, and the fork
      # point is neither guaranteed: `origin` here is the FORK, whose master had
      # sat 180 commits behind upstream, on the previous net and the previous
      # bench. So the fallback returned a base the gate could only ever report
      # VOID against -- on exactly the force-push that triggers the fallback in
      # the first place.
      #
      # The floor is the newest of the two boundaries, both readable from git
      # without building anything: the commit that introduced HEAD's net, and
      # the commit that introduced HEAD's `Bench:` anchor. Take whichever of the
      # fork point and those two is newest, so the span measured is the largest
      # one that can carry a verdict -- and so a fork whose master is current
      # goes back to using the fork point with nothing to change here.
      - name: Resolve the two sides
        id: revs
        run: |
          set -u
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head=HEAD
            # Empty, or every character a zero: not a commit.
            case "$base" in
              ''|*[!0]*) ;;
              *) base="" ;;
            esac
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              fork=$(git merge-base HEAD origin/master 2>/dev/null \
                     || git merge-base HEAD master 2>/dev/null || true)
              # A here-string, not a pipe into `grep -m1`: grep closes the pipe
              # on the first match, git log dies of SIGPIPE, and a shell with
              # pipefail turns finding the anchor into a failure. The anchor
              # gate carries the same note for the same reason -- named without
              # its path, because docslint reads a `tests/<name>.sh` anywhere in
              # a workflow as that workflow RUNNING the gate.
              history=$(git log --format=%b HEAD)
              bench=$(grep -m1 -oE '^Bench: [1-9][0-9]{5,7}$' <<< "$history" \
                      | grep -oE '[0-9]+' || true)
              # Both paths: the net name moved to engine/ with the zone split, so
              # a walk reaching upstream has to name where it used to live too.
              net=$({ git show HEAD:src/engine/evaluate.h 2>/dev/null \
                      || git show HEAD:src/evaluate.h 2>/dev/null; } \
                    | grep -oE 'nn-[0-9a-f]+\.nnue' | head -1 || true)
              # `tail -1`, not `--reverse | head -1`: the oldest commit that
              # changed the count is the last line of a newest-first walk, and
              # tail reads the whole stream rather than closing it early.
              netbase=''
              [ -n "$net" ] && netbase=$(git log --format=%H -S"$net" \
                -- src/engine/evaluate.h src/evaluate.h | tail -1)
              benchbase=''
              [ -n "$bench" ] && benchbase=$(git log --format=%H -E \
                --grep="^Bench: $bench\$" | tail -1)
              base=''
              for c in "$fork" "$netbase" "$benchbase"; do
                [ -n "$c" ] || continue
                git cat-file -e "$c^{commit}" 2>/dev/null || continue
                git merge-base --is-ancestor "$c" HEAD 2>/dev/null || continue
                if [ -z "$base" ] || git merge-base --is-ancestor "$base" "$c"; then
                  base=$c
                fi
              done
              [ -n "$base" ] || base="HEAD~1"
              echo "the push base was unusable; measuring against $base instead"
              echo "  fork point $fork, net floor $netbase, bench floor $benchbase"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # Measure two tiers: a change can improve one and regress the other, and
      # callgrind implements no AVX-512 so the instruction axis stops at avx2.
      #
      # Keep `set -o pipefail` and the explicit `exit "$rc"`. `cmd | tee log`
      # reports TEE's status, so a step whose last command is the pipeline -- or
      # worse, a trailing `echo` -- passes while perfbudget.sh returned 1, and
      # the lane can then never fail. Exit 2 is failed on purpose: a gate that
      # could not run has proven nothing and must not read as green.
      - name: Instruction budget, x86-64-avx2
        run: |
          set -o pipefail
          rc=0
          ./tests/perfbudget.sh --arch x86-64-avx2 \
            "${{ steps.revs.outputs.base }}" "${{ steps.revs.outputs.head }}" \
            2>&1 | tee budget-avx2.log || rc=$?
          if [ "$rc" = "2" ]; then
            echo "::error::perfbudget SKIPPED -- it proved nothing"
          fi
          exit "$rc"

      - name: Instruction budget, x86-64-sse41-popcnt
        if: always()
        run: |
          set -o pipefail
          rc=0
          ./tests/perfbudget.sh --arch x86-64-sse41-popcnt \
            "${{ steps.revs.outputs.base }}" "${{ steps.revs.outputs.head }}" \
            2>&1 | tee budget-sse41.log || rc=$?
          if [ "$rc" = "2" ]; then
            echo "::error::perfbudget SKIPPED -- it proved nothing"
          fi
          exit "$rc"

      # textequal is deterministic, so it gets a lane. Do not add npsab beside
      # it: a hosted runner is not an idle box, and a wall-clock ratio measured
      # on one is noise wearing a number. npsab stays local, and the gap is real
      # -- no lane here can establish that a change is faster.
      - name: Codegen equivalence (informational)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/textequal.sh \
            "${{ steps.revs.outputs.base }}" "${{ steps.revs.outputs.head }}" \
            2>&1 | tee textequal.log

      - name: Summary
        if: always()
        run: |
          {
            echo '## Instruction budget'
            echo
            echo 'Startup subtracted by measurement. Node counts must match or the'
            echo 'comparison is void. See `docs/11-performance.md` for what this gate'
            echo 'can and cannot see -- in particular that a locality win can read'
            echo 'here as a regression.'
            echo
            for f in budget-avx2.log budget-sse41.log textequal.log; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
