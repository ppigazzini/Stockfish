name: IWYU
on:
  workflow_call:
# Least privilege at the workflow level so a job added later inherits it.
# A job needing more declares it and that grant wins.
permissions:
  contents: read

jobs:
  Analyzers:
    name: Check includes
    runs-on: ubuntu-22.04
    # Cold cache pays a ~1 GB toolchain download and an IWYU build from source
    # before the three tiers start. Warm, the toolchain steps are a restore.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Stockfish/src
        shell: bash
    steps:
      - name: Checkout Stockfish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Stockfish
          persist-credentials: false

      # ninja and cmake build IWYU; everything else comes from the release
      # tarball below. From the stock Ubuntu repository, which is the point --
      # see the next comment.
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      # THE TOOLCHAIN COMES FROM THE LLVM RELEASE TARBALL, NOT FROM apt.llvm.org.
      #
      # This lane used to add the llvm-toolchain-jammy-17 repository, `apt-key
      # add` its signing key, and install libclang-17-dev, clang-17 and
      # libc++-17-dev. It died on `GPG error: ... the following signatures
      # couldn't be verified` -- a third-party repository and a deprecated key
      # command failing for reasons that have nothing to do with this tree's
      # includes, and failing in a way no commit here can fix.
      #
      # The official 17.0.6 release tarball carries clang, libclang and libc++
      # together, over plain HTTPS from the llvm-project releases. jammy has no
      # libc++-17 of its own, which is the only reason the third-party
      # repository was ever here.
      #
      # INSTALLED INTO THE LLVM PREFIX, and that is load-bearing rather than
      # tidy. IWYU finds libc++ relative to its own binary, so an IWYU sitting
      # beside the tarball's clang reads the tarball's libc++ off the default
      # search path -- which is what tests/iwyu.sh probes for, and what makes it
      # resolve mode=native, the mode that returns an ABSOLUTE verdict.
      # Installed anywhere else the same headers are on disk but on no path the
      # tool searches, the script falls back to reaching them with `-nostdinc++
      # -isystem` and a hand-passed -resource-dir, and that mode reports
      # findings the lane does not -- so it is a differential only and SKIPS
      # when asked for a verdict. One -DCMAKE_INSTALL_PREFIX is the whole
      # difference between a lane that answers and a lane that skips.
      #
      # resources/ is this tree's scratch directory, which .gitignore covers and
      # which tests/iwyu.sh looks in before PATH. The fetch is inlined here
      # rather than kept in a script for the same reason docs.yml inlines its
      # shellcheck fetch: resources/ holds no tracked source, so a workflow step
      # cannot call a helper that lives only in it.
      - name: Cache the IWYU toolchain
        id: iwyu-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Stockfish/resources/iwyu
          key: iwyu-ubuntu-22.04-llvm-17.0.6-f25caa280dc3277c4086ec345ad279a2463fea0f

      - name: Build include-what-you-use
        if: steps.iwyu-cache.outputs.cache-hit != 'true'
        working-directory: Stockfish/resources
        run: |
          set -eu
          llvm_ver=17.0.6
          iwyu_pin=f25caa280dc3277c4086ec345ad279a2463fea0f
          tar=clang+llvm-$llvm_ver-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          mkdir -p iwyu/llvm && cd iwyu
          curl -fsSL --retry 3 -o "$tar" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvm_ver/$tar"
          tar -xJf "$tar" -C llvm --strip-components=1
          rm -f "$tar"
          git clone --quiet https://github.com/include-what-you-use/include-what-you-use.git src
          git -C src checkout --quiet "$iwyu_pin"
          cmake -S src -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/llvm" \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          cmake --install build

      - name: Check include-what-you-use
        run: ../resources/iwyu/llvm/bin/include-what-you-use --version

      # EXTRACXXFLAGS, NOT CXXFLAGS, and a NAMED ARCH.
      #
      # A `CXXFLAGS=` on the make command line REPLACES the Makefile's own
      # assignment, and that assignment is where every architecture define
      # lives. Passing the IWYU flags that way produced compile lines carrying
      # no -DUSE_AVX2, no -DUSE_AVX512ICL, no -DIS_64BIT and no -DARCH: the lane
      # checked a configuration nobody builds, and every `#if defined(USE_...)`
      # block in the tree -- the AVX-512 move splat, the feature transformer's
      # SIMD paths, the accumulator -- sat inside an `#if` it never entered.
      # Ten files had findings the moment the defines came back.
      #
      # EXTRACXXFLAGS is interpolated INTO CXXFLAGS instead, so the arch flags
      # survive. The Makefile appends -flto after it, which IWYU ignores.
      #
      # THREE TIERS, because the include set of a file with `#if` in it is a
      # property of the tier and not of the file. Three is what it takes to
      # reach every branch this tree has: the generic scalar path, the SSE/AVX2
      # path, and the AVX-512 one. `ARCH=native` would name none of them and
      # would make the lane's answer depend on the runner it landed on.
      #
      # One job rather than a matrix: building IWYU from source is the expensive
      # step and it is paid once. `make analyze` runs objclean first, so the
      # tiers do not see each other's objects.
      #
      # All of it lives in tests/iwyu.sh rather than here. It used to live here,
      # and then the only way to run the lane locally was to retype it -- which
      # does not work on a host with no libc++ package, and produced a report
      # claiming a green lane nobody had seen. The script owns the flags above,
      # detects whether the host looks like this runner, and says which of its
      # two modes produced its answer. Native mode, which is what runs here,
      # gives the absolute verdict.
      - name: Check includes
        run: ../tests/iwyu.sh
