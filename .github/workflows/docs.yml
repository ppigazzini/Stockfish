name: Docs

on:
  workflow_call:
  workflow_dispatch:

# Both gates read the tree and nothing else: no build, no network, seconds to run.
# They are separate steps rather than one so a red run names which property broke.
jobs:
  Docs:
    name: Documentation and lane coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # docslint reads the current bench signature out of the commit record, so
      # it needs history rather than a shallow checkout.
      - name: Documentation lint
        run: ./tests/docslint.sh

      - name: Lane coverage
        run: ./tests/lanecheck.sh

      # Cheap, and the prerequisite for trusting the two zone checks below: a
      # source the build names nowhere produces no object for them to reason
      # about.
      - name: Build coverage
        run: ./tests/buildcoverage.sh

      - name: Dependency direction, by include
        run: ./tests/depcheck.sh

      # Symbol-level, so it builds. It stays in this workflow rather than a
      # lane of its own because it answers the same question depcheck does and
      # a reader looking for one should find the other beside it.
      - name: Dependency direction, by symbol
        run: ./tests/linkcheck.sh

      # The strong form: link engine/ alone against a stub main and nothing
      # else. It subsumes the check above -- it sees a reference to a symbol
      # nothing defines, and it sees an inline call -- and it is what makes each
      # seam's default a tested path rather than a claim.
      - name: The engine links alone
        run: ./tests/enginelink.sh
