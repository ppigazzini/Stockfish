name: Docs

on:
  workflow_call:
  workflow_dispatch:

# Keep one gate per step, so a red run names which property broke rather than
# just the job. docslint, lanecheck, buildcoverage and depcheck read the tree and
# nothing else; linkcheck and enginelink build a scratch copy of it, which is
# what the net fetch below is for. That copy is `git ls-files src scripts | tar`
# into a mktemp directory, NOT a git worktree: it carries uncommitted edits to
# tracked files and drops untracked ones, so `git worktree list` never shows it.
jobs:
  Docs:
    name: Documentation and lane coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # docslint reads the current bench signature out of the commit record, so
      # it needs history rather than a shallow checkout.
      - name: Documentation lint
        run: ./tests/docslint.sh

      - name: Lane coverage
        run: ./tests/lanecheck.sh

      # Put a net in src/ before the two building gates run: linkcheck.sh and
      # enginelink.sh copy src/*.nnue into their scratch copy so the build there
      # never reaches the network. Without this step each scratch build runs the
      # Makefile's own net target, and a mirror outage then surfaces as a zone
      # gate exiting 2 instead of as a named download failure.
      - name: Fetch the net
        working-directory: src
        run: make net

      # Run before the two symbol-level gates: linkcheck and enginelink reason
      # over objects, and a source the Makefile's SRCS names nowhere produces no
      # object, so it can call straight into the shell with both of them green.
      - name: Build coverage
        run: ./tests/buildcoverage.sh

      - name: Dependency direction, by include
        run: ./tests/depcheck.sh

      # Reads the workflow files and nothing else. The three properties it gates
      # -- SHA-pinned, version stated, one action one version -- need no network,
      # so the lane is deterministic; the release feed half skips without gh.
      - name: Action pins
        run: ./tests/actionpins.sh

      # Ask the boundary question at the link, so this one builds: depcheck reads
      # `#include` lines, this asks whether an engine OBJECT references a symbol
      # only a shell object defines. An edge no include spells -- a template
      # parameter, a declaration arriving through a platform header -- is
      # invisible above and caught only here.
      - name: Dependency direction, by symbol
        run: ./tests/linkcheck.sh

      # The strong form: link engine/ alone against tests/enginelink_main.cpp and
      # nothing else, then run it. It sees a reference to a symbol nothing in the
      # tree defines, which linkcheck's set intersection cannot, and running with
      # no seam registered is what makes each seam's default a tested path rather
      # than one that merely resolves.
      - name: The engine links alone
        run: ./tests/enginelink.sh
