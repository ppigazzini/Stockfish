name: Docs

on:
  workflow_call:
  workflow_dispatch:

# Keep one gate per step, so a red run names which property broke rather than
# just the job. docslint, lanecheck, buildcoverage and depcheck read the tree and
# nothing else; linkcheck and enginelink build a scratch copy of it, which is
# what the net fetch below is for. That copy is `git ls-files src scripts | tar`
# into a mktemp directory, NOT a git worktree: it carries uncommitted edits to
# tracked files and drops untracked ones, so `git worktree list` never shows it.
# Least privilege at the workflow level so a job added later inherits it.
# A job needing more declares it and that grant wins.
permissions:
  contents: read

jobs:
  Docs:
    name: Documentation and lane coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # docslint reads the current bench signature out of the commit record, so
      # it needs history rather than a shallow checkout.
      - name: Documentation lint
        run: ./tests/docslint.sh

      - name: Lane coverage
        run: ./tests/lanecheck.sh

      # Install the PIN rather than use the image's shellcheck. A lint's finding
      # set is version-dependent: the runner ships 0.9.0, which reports a
      # trap-invoked cleanup function as SC2317 where 0.11.0 reports SC2329, so
      # suppressions written against one version do not apply under the other.
      # Unpinned, this gate read 0 findings on a developer box and 65 here from
      # the same tree.
      #
      # tests/shellcheck.version is the single owner of the number; the gate
      # asserts against the same file and SKIPs if what it finds disagrees.
      # Installed under resources/, which .gitignore covers and the gate looks
      # in before PATH.
      - name: Install the pinned shellcheck
        run: |
          v=$(tr -d ' \t\n' < tests/shellcheck.version)
          mkdir -p resources/shellcheck
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.linux.x86_64.tar.xz" \
            | tar -xJ -C resources/shellcheck --strip-components=1 "shellcheck-v$v/shellcheck"
          resources/shellcheck/shellcheck --version

      # Judges scope against the fork point, which is why the checkout above
      # fetches full history: a shallow clone has none, and the gate then puts
      # every script in scope rather than skipping.
      - name: Shell lint
        run: ./tests/shellcheck.sh

      # Put a net in src/ before the two building gates run: linkcheck.sh and
      # enginelink.sh copy src/*.nnue into their scratch copy so the build there
      # never reaches the network. Without this step each scratch build runs the
      # Makefile's own net target, and a mirror outage then surfaces as a zone
      # gate exiting 2 instead of as a named download failure.
      - name: Fetch the net
        working-directory: src
        run: make net

      # Run before the two symbol-level gates: linkcheck and enginelink reason
      # over objects, and a source the Makefile's SRCS names nowhere produces no
      # object, so it can call straight into the shell with both of them green.
      - name: Build coverage
        run: ./tests/buildcoverage.sh

      - name: Dependency direction, by include
        run: ./tests/depcheck.sh

      # Reads the workflow files and nothing else. The properties it gates -- a
      # full release named, one action one version, a deadline on every job and
      # a permission floor on every workflow -- need no network, so the lane is
      # deterministic.
      - name: Action pins
        run: ./tests/actionpins.sh
      # `.github/workflows/actions.lock` names the commit every action a
      # workflow runs resolves to, an action another action calls included, and
      # the runner runs that commit. This reads the file against the workflows
      # and against upstream: a `uses:` with no entry, or a tag moved off its
      # locked commit, fails here.
      - name: Install the lockfile checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
      # The workflows themselves, statically: template injection, persisted
      # credentials, over-broad permissions, unpinned actions and dangerous
      # triggers. zizmor reads the lockfile and takes a tag it locks as pinned;
      # the token runs its online audits beside the static ones; .github/zizmor.yml
      # names the findings this tree keeps and why. The version is pinned, as
      # ../valgebra pins it, so a zizmor release cannot redden an unchanged tree.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Workflow audit (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.33.0 .github/

      # Reads the commit record, so it needs the full history the checkout above
      # already fetches. It is what says the anchor the architecture lanes read is
      # the one AGENTS.md's rule names.
      - name: Bench anchor
        run: ./tests/anchor.sh

      # Ask the boundary question at the link, so this one builds: depcheck reads
      # `#include` lines, this asks whether an engine OBJECT references a symbol
      # only a shell object defines. An edge no include spells -- a template
      # parameter, a declaration arriving through a platform header -- is
      # invisible above and caught only here.
      - name: Dependency direction, by symbol
        run: ./tests/linkcheck.sh

      # The strong form: link engine/ alone against tests/enginelink_main.cpp and
      # nothing else, then run it. It sees a reference to a symbol nothing in the
      # tree defines, which linkcheck's set intersection cannot, and running with
      # no seam registered is what makes each seam's default a tested path rather
      # than one that merely resolves.
      - name: The engine links alone
        run: ./tests/enginelink.sh
