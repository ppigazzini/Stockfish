name: Sanitizers
on:
  workflow_call:
jobs:
  Test-under-sanitizers:
    name: ${{ matrix.sanitizers.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      COMPCXX: ${{ matrix.config.compiler }}
      COMP: ${{ matrix.config.comp }}
      CXXFLAGS: "-Werror"
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Ubuntu 22.04 GCC
            os: ubuntu-22.04
            compiler: g++
            comp: gcc
            shell: bash
        sanitizers:
          - name: Run with thread sanitizer
            make_option: sanitize=thread
            cxx_extra_flags: ""
            instrumented_option: sanitizer-thread
          - name: Run with UB sanitizer
            make_option: sanitize=undefined
            cxx_extra_flags: ""
            instrumented_option: sanitizer-undefined
          - name: Run under valgrind
            make_option: ""
            cxx_extra_flags: ""
            instrumented_option: valgrind
          - name: Run under valgrind-thread
            make_option: ""
            cxx_extra_flags: ""
            instrumented_option: valgrind-thread
          - name: Run non-instrumented
            make_option: ""
            cxx_extra_flags: ""
            instrumented_option: none
          - name: Run with glibcxx assertions
            make_option: ""
            cxx_extra_flags: -D_GLIBCXX_ASSERTIONS
            instrumented_option: none
    defaults:
      run:
        working-directory: src
        shell: ${{ matrix.config.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache syzygy test data
        id: cache-syzygy-test
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tests/syzygy
          key: syzygy-test-9b9aa13

      - name: Download required linux packages
        run: |
          sudo apt update
          sudo apt install expect valgrind g++-multilib

      - name: Download the used network from the fishtest framework
        run: make net

      - name: Check compiler
        run: $COMPCXX -v

      - name: Test help target
        run: make help

      - name: Check git
        run: git --version

      # Since Linux Kernel 6.5 we are getting false positives from the ci,
      # lower the ALSR entropy to disable ALSR, which works as a temporary workaround.
      # https://github.com/google/sanitizers/issues/1716
      # https://bugs.launchpad.net/ubuntu/+source/linux/+bug/2056762

      - name: Lower ALSR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Install requests explicitly rather than rest on the runner image, which
      # happens to ship it: tests/testing.py imports it, so the day the image
      # drops it instrumented.py dies on import and this lane stops exercising
      # the sanitized binary at all. pyproject.toml declares it in the `gates`
      # group for the same reason.
      - name: Install the gate's Python dependency
        run: python3 -m pip install --user requests

      # Sanitizers

      - name: ${{ matrix.sanitizers.name }}
        run: |
          export CXXFLAGS="-O1 -fno-inline ${{ matrix.sanitizers.cxx_extra_flags }}"
          make clean
          make -j4 ARCH=x86-64-sse41-popcnt ${{ matrix.sanitizers.make_option }} debug=yes optimize=no build > /dev/null
          python3 ../tests/instrumented.py --${{ matrix.sanitizers.instrumented_option }} ./stockfish

  # Every lane above drives the engine with input the engine would accept. This
  # one drives it with input that was ONCE accepted and must never be again: the
  # fixtures are the crafted tablebase headers that reached an out-of-bounds
  # write, a negative resize and two undefined shifts. They are regression
  # fixtures rather than a fuzzer -- fuzz.yml looks for what nobody has described
  # yet, on a nightly budget, and is explicitly not a merge gate. This is.
  Malformed-input:
    name: Refuse a malformed file
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the used network from the fishtest framework
        working-directory: src
        run: make net

      # Same workaround as the matrix above: since Linux 6.5 the runner's ASLR
      # entropy makes ASan report false positives.
      - name: Lower ALSR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # The gate's last fixture is one byte of a REAL table, which needs the
      # corpus. A mirror outage must not fail the job -- the fixture then SKIPS
      # loudly inside the gate and the other five still run.
      - name: Fetch the 3-man tablebases
        continue-on-error: true
        run: ./tests/tbfetch.sh

      - name: Refuse every known-bad fixture
        run: ./tests/malformed.sh
