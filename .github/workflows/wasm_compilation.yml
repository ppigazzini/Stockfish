name: WASM Compilation

on:
  workflow_call:

jobs:
  wasm:
    name: wasm (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [wasm32, wasm32-relaxed-simd]
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install emsdk
        working-directory: .
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Extract the bench number from the commit history
        run: |
          # See tests.yml for why this is one `git log` and an anchored regex.
          # A HERE-STRING, not a pipe from git log. `grep -m1` exits on the first
          # match and closes the pipe, `git log` dies of SIGPIPE part-way through
          # the history, and `pipefail` propagates 141 -- so the step fails
          # BECAUSE the anchor was found. Capturing first lets the producer finish.
          history=$(git log --format=%b)
          benchref=$(grep -m1 -oE '^Bench: *[1-9][0-9]{5,7}$' <<< "$history" | grep -oE '[0-9]+' || true)
          [[ -n "$benchref" ]] || { echo "No Bench: footer anywhere in the history -- refusing to run the anchor lanes against an empty reference"; exit 1; }
          echo "benchref=$benchref" >> $GITHUB_ENV
          echo "Reference bench: $benchref"

      - name: Download the used network from the fishtest framework
        run: make net

      - name: Build ${{ matrix.arch }} build
        run: |
          source $GITHUB_WORKSPACE/emsdk/emsdk_env.sh
          em++ --version
          # Keep the zone directory on the path: EvalFileDefaultName is defined
          # in src/engine/evaluate.h, and grep exits 2 on a path that is not
          # there. This job runs `shell: bash`, which is `-e -o pipefail`, so
          # that exit fails the step instead of building with an empty
          # --preload-file and a binary that finds no net.
          net=$(grep -oE 'nn-[0-9a-f]+\.nnue' engine/evaluate.h | head -1)
          make clean
          COMPCXX=em++ make -j build ARCH=${{ matrix.arch }} EXTRALDFLAGS="--preload-file $net"

      - name: Verify bench under node
        run: EXE=./stockfish.js RUN_PREFIX=node ../tests/signature.sh "$benchref"
