# Pre-commit hooks: file hygiene, Python lint/format/type-check, clang-format,
# and the repo's own static gates.
#
# Install once with `pre-commit install`; run everything with
# `pre-commit run --all-files`. CI does not run these -- the workflows' own gates
# stay the authority; this catches the same classes before the commit exists.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      # Two exclusions, both load-bearing. Byte-exact comparison inputs:
      # tests/cases/*.golden is matched against engine output verbatim and *.uci
      # is what produces it, so a trailing newline added to either is a
      # mismatch, not a tidy-up. And src/incbin/ is vendored -- rewriting a
      # third-party header to this repo's whitespace taste makes every future
      # update a conflict, which is why CI's clang-format excludes it too.
      - id: end-of-file-fixer
        exclude: '\.(golden|uci|nnue|epd|fens)$|^src/incbin/'
      - id: trailing-whitespace
        exclude: '\.(golden|uci|nnue|epd|fens)$|^src/incbin/'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      # The hook's own entry checks the whole project (ty's cross-file
      # diagnostics make per-filename invocation wrong); [tool.ty] in
      # pyproject.toml scopes it to tests/ and pins the env.
      - id: ty
  - repo: local
    hooks:
      # Run the repo's own format target so drift never reaches CI, and run it
      # through `make format` rather than a bare clang-format entry or a
      # third-party mirror: the Makefile owns the file list and a mirror would
      # add a supply-chain edge for one command. It rewrites in place, so
      # pre-commit fails on the modified file and the next run passes.
      #
      # ONLY with clang-format-20, the version CI pins. A different major
      # reformats the whole tree to its own house style -- running one here once
      # rewrote 29 files nobody had touched. `make format` refuses on its own
      # now, so this guard chooses what happens instead: a loud SKIP rather than
      # a failed commit. CI's own clang-format step is continue-on-error, so a
      # local skip weakens no blocking gate.
      - id: clang-format
        name: make format
        entry: >-
          bash -c 'command -v clang-format-20 >/dev/null
          && (cd src && make format)
          || echo "SKIP: clang-format-20 not installed (CI pins 20; local clang-format is another major)"'
        language: system
        files: '^src/.*\.(cpp|h)$'
        pass_filenames: false
      # Docs are part of the change (AGENTS.md): an edit that breaks a link,
      # names a dead path, quotes the bench signature, or leaves a gate
      # undiscoverable should fail here rather than in CI.
      - id: docs-lint
        name: tests/docslint.sh
        entry: ./tests/docslint.sh
        language: system
        files: '\.(md|sh|py|yml)$'
        pass_filenames: false
      # A new gate with no lane, or an excuse that has expired, is caught at the
      # commit that introduces it rather than a CI run later.
      - id: lane-coverage
        name: tests/lanecheck.sh
        entry: ./tests/lanecheck.sh
        language: system
        files: '^(tests|scripts)/.*|^\.github/workflows/.*'
        pass_filenames: false
      # The shell the gates are written in. It SKIPs (exit 2) when shellcheck is
      # on neither PATH nor resources/, and pre-commit reads a non-zero status
      # as a failure -- so the entry maps a skip back to success and says so on
      # stdout. CI's lane is the authority and it runs on an image that ships
      # the tool; this catches the same class before the commit exists.
      - id: shell-lint
        name: tests/shellcheck.sh
        entry: >-
          bash -c './tests/shellcheck.sh; rc=$?;
          [ "$rc" = 2 ] && echo "SKIP: no shellcheck (./resources/shellcheck-setup.sh)" && exit 0;
          exit "$rc"'
        language: system
        files: '^(tests|scripts)/.*\.sh$'
        pass_filenames: false
      # An engine file reaching into the shell, or a baselined edge that no
      # longer happens. Cheap, and the commit that adds the include is the one
      # that should hear about it.
      - id: dep-direction
        name: tests/depcheck.sh
        entry: ./tests/depcheck.sh
        language: system
        files: '^src/.*\.(cpp|h)$|^tests/depcheck\.baseline$'
        pass_filenames: false
